services:
  pratevenn:
    image: ghcr.io/cogitatortech/pratevenn:${PRATEVENN_VERSION:-latest}-cpu
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu
    environment:
      - PRATEVENN_MODEL_DIR=/models
      - PRATEVENN_HOST=0.0.0.0
      - PRATEVENN_ALLOWED_HOSTS=*
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - models:/models
    restart: unless-stopped

  pratevenn-cuda:
    image: ghcr.io/cogitatortech/pratevenn:${PRATEVENN_VERSION:-latest}-cuda
    build:
      context: .
      dockerfile: Dockerfile
      target: cuda
    environment:
      - PRATEVENN_MODEL_DIR=/models
      - PRATEVENN_HOST=0.0.0.0
      - PRATEVENN_ALLOWED_HOSTS=*
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - cuda
      - gpu
    restart: unless-stopped

volumes:
  models:
    driver: local
