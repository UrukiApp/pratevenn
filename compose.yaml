services:
  pratevenn:
    image: ghcr.io/urukiapp/pratevenn-cpu:${PRATEVENN_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu
    environment:
      - PRATEVENN_MODEL_DIR=/models
      - PRATEVENN_HOST=0.0.0.0
      - PRATEVENN_DATA_DIR=/data
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - models:/models
      - data:/data
    restart: unless-stopped

  pratevenn-cuda:
    image: ghcr.io/urukiapp/pratevenn-cuda:${PRATEVENN_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.cuda
    environment:
      - PRATEVENN_MODEL_DIR=/models
      - PRATEVENN_HOST=0.0.0.0
      - PRATEVENN_DATA_DIR=/data
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - models:/models
      - data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - cuda
      - gpu
    restart: unless-stopped

volumes:
  data:
    driver: local
  models:
    driver: local
