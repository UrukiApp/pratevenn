[project]
name = "pratevenn"
version = "0.1.0-alpha.6"
description = "A local conversational AI tool for Norwegian language learners"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Hassan Abedi", email = "hassan.abedi.t@gmail.com" }
]
maintainers = [
    { name = "Hassan Abedi", email = "hassan.abedi.t@gmail.com" }
]
keywords = ["norwegian", "speech", "language-learning", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "websockets>=14",
    "faster-whisper>=1.2",
    "piper-tts>=1.3",
    "llama-cpp-python>=0.3.35",
    "huggingface-hub>=0.34,<2",
    "av<19",
]

[project.optional-dependencies]
cpu = ["llama-cpp-python>=0.3.35"]
cuda = [
    "llama-cpp-python>=0.3.35",
    "nvidia-cublas-cu12>=12.5,<12.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12>=12.5,<12.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

dev = [
    "httpx>=0.28,<1",
    "pytest>=8.0.1",
    "pytest-cov>=6.0.0",
    "mypy>=1.11.1",
    "ruff>=0.9.3",
    "pre-commit>=4.2.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.12",
    "mkdocstrings-python>=1.16.10",
    "playwright>=1.50,<2",
]

[project.scripts]
pratevenn = "pratevenn.__main__:main"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
llama-cpp-python = [
    { index = "pypi", extra = "cpu" },
    { url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.35-cu125/llama_cpp_python-0.3.35-py3-none-manylinux_2_35_x86_64.whl", extra = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pypi", extra = "cuda", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[project.urls]
Repository = "https://github.com/UrukiApp/pratevenn"
Documentation = "https://github.com/UrukiApp/pratevenn/blob/main/README.md"

[tool.hatch.build.targets.wheel]
packages = ["pratevenn"]

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "--tb=short",
    #"--disable-warnings",
    "--cov=pratevenn",
    "--cov-branch",
    "--cov-report=term",
    "--cov-report=xml",
    "-rs"
]

[tool.coverage.run]
branch = true
parallel = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = false
skip_empty = true
precision = 2

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
strict_optional = true
warn_redundant_casts = true
exclude = "^(scripts/|tests/)"

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".mypy_cache",
    ".nox", ".pants.d", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv",
    "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules",
    "venv", "tests"
]
line-length = 100
indent-width = 4
src = ["pratevenn"]
target-version = "py311"
unsafe-fixes = false

[tool.ruff.lint]
select = ["ANN", "E", "F", "I", "W", "B", "RUF", "SIM", "C90"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"pratevenn/app.py" = ["C901"]
"pratevenn/models.py" = ["C901"]
"tests/**/*.py" = []
