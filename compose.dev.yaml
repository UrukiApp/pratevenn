# Mounts the host .models directory so locally downloaded models are reused without re-downloading.
# Use with:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
# or:
#   make start-dev
services:
  pratevenn:
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu
    volumes:
      - ./.models:/models

  pratevenn-cuda:
    build:
      context: .
      dockerfile: Dockerfile
      target: cuda
    volumes:
      - ./.models:/models
