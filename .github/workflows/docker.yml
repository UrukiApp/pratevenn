name: Build Docker Images

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'pratevenn/**'
      - 'Dockerfile*'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docker-compose*.yaml'
      - '.github/workflows/docker.yml'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  images:
    name: Build Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: pratevenn-cpu
            file: Dockerfile
            target: cpu
          - name: pratevenn-cuda
            file: Dockerfile.cuda
            target: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the ${{ matrix.name }} Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
